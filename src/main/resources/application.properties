spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/examdb}
spring.datasource.username=${DB_USER:vardhan}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

# Free-tier DBs allow few connections, so keep the pool small
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000

# Render gives you the port and terminates HTTPS in front of your app
server.port=${PORT:8080}
server.forward-headers-strategy=framework