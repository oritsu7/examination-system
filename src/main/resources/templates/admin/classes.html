<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Classes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-body">
    <div th:replace="~{fragments/navbar :: navbar('Manage Classes')}"></div>
    <main class="dashboard-content">
        <div class="page-header">
            <div>
                <h1>Classes</h1>
                <p>Classes group students and subjects together — students only see subjects tied to their class.</p>
            </div>
        </div>

        <p th:if="${error}" class="error-msg" th:text="${error}"></p>

        <form th:action="@{/admin/classes}" method="post" class="inline-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="name" placeholder="Class name (e.g. bca5A)" required>
            <button type="submit">Add Class</button>
        </form>

        <div th:if="${#lists.isEmpty(classes)}" class="empty-state">
            <div class="empty-glyph mono">—</div>
            <strong>No classes yet</strong>
            <p>Add your first class above to start assigning subjects and students.</p>
        </div>

        <table th:unless="${#lists.isEmpty(classes)}">
            <thead><tr><th>ID</th><th>Name</th><th></th></tr></thead>
            <tbody>
                <tr th:each="c : ${classes}">
                    <td data-label="ID" class="mono" th:text="${c.id}"></td>
                    <td data-label="Name" th:text="${c.name}"></td>
                    <td data-label="">
                        <form th:action="@{/admin/classes/{id}/delete(id=${c.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
