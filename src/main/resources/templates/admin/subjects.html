<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Subjects</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-body">
    <div th:replace="~{fragments/navbar :: navbar('Manage Subjects')}"></div>
    <main class="dashboard-content">
        <div class="page-header">
            <div>
                <h1>Subjects</h1>
                <p>Each subject belongs to one class and one teacher — that teacher manages its chapters and exams.</p>
            </div>
        </div>

        <p th:if="${error}" class="error-msg" th:text="${error}"></p>

        <form th:action="@{/admin/subjects}" method="post" class="inline-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="name" placeholder="Subject name" required>
            <select name="classId" required>
                <option value="">Class</option>
                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <select name="teacherId" required>
                <option value="">Teacher</option>
                <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.name}"></option>
            </select>
            <button type="submit">Add Subject</button>
        </form>

        <div th:if="${#lists.isEmpty(subjects)}" class="empty-state">
            <div class="empty-glyph mono">—</div>
            <strong>No subjects yet</strong>
            <p>Add a subject above once you have at least one class and one approved teacher.</p>
        </div>

        <table th:unless="${#lists.isEmpty(subjects)}">
            <thead><tr><th>ID</th><th>Name</th><th>Class</th><th>Teacher</th><th></th></tr></thead>
            <tbody>
                <tr th:each="s : ${subjects}">
                    <td data-label="ID" class="mono" th:text="${s.id}"></td>
                    <td data-label="Name" th:text="${s.name}"></td>
                    <td data-label="Class" th:text="${s.schoolClass.name}"></td>
                    <td data-label="Teacher" th:text="${s.teacher.name}"></td>
                    <td data-label="">
                        <form th:action="@{/admin/subjects/{id}/delete(id=${s.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
