<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chapters</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-body">
    <div th:replace="~{fragments/navbar :: navbar('Chapters')}"></div>
    <main class="dashboard-content">
        <div class="page-header">
            <div>
                <h1>Chapters</h1>
                <p>Chapters organize your question bank — exams draw questions from the chapters you pick.</p>
            </div>
            <a th:href="@{/teacher/subjects/{id}/exams(id=${subjectId})}" class="admin-nav-link">Create / View Exams</a>
        </div>

        <form th:action="@{/teacher/subjects/{id}/chapters(id=${subjectId})}" method="post" class="inline-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="name" placeholder="Chapter name" required>
            <button type="submit">Add Chapter</button>
        </form>

        <div th:if="${#lists.isEmpty(chapters)}" class="empty-state">
            <div class="empty-glyph mono">—</div>
            <strong>No chapters yet</strong>
            <p>Add a chapter above, then add questions to it before creating an exam.</p>
        </div>

        <table th:unless="${#lists.isEmpty(chapters)}">
            <thead><tr><th>ID</th><th>Name</th><th></th></tr></thead>
            <tbody>
                <tr th:each="c : ${chapters}">
                    <td data-label="ID" class="mono" th:text="${c.id}"></td>
                    <td data-label="Name" th:text="${c.name}"></td>
                    <td data-label="" class="action-group">
                        <a th:href="@{/teacher/chapters/{id}/questions(id=${c.id})}" class="admin-nav-link">Questions</a>
                        <form th:action="@{/teacher/chapters/{id}/delete(id=${c.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="subjectId" th:value="${subjectId}"/>
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
