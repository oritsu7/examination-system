<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="dashboard-body">
    <div th:replace="~{fragments/navbar :: navbar('Manage Users')}"></div>
    <main class="dashboard-content">
        <div class="page-header">
            <div>
                <h1>Users</h1>
                <p>New sign-ups need approval before they can log in. Students also need a class assigned.</p>
            </div>
        </div>

        <p th:if="${error}" class="error-msg" th:text="${error}"></p>

        <div th:if="${#lists.isEmpty(users)}" class="empty-state">
            <div class="empty-glyph mono">—</div>
            <strong>No users yet</strong>
            <p>Accounts will appear here once people sign up.</p>
        </div>

        <table th:unless="${#lists.isEmpty(users)}">
            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Class</th><th></th></tr></thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td data-label="ID" class="mono" th:text="${u.id}"></td>
                    <td data-label="Name" th:text="${u.name}"></td>
                    <td data-label="Email" th:text="${u.email}"></td>
                    <td data-label="Role" th:text="${u.role}"></td>
                    <td data-label="Status">
                        <span th:if="${u.approved}" class="status-badge status-approved"><i class="dot"></i>Approved</span>
                        <span th:unless="${u.approved}" class="status-badge status-pending"><i class="dot"></i>Pending</span>
                    </td>
                    <td data-label="Class">
                        <span th:if="${u.role.name() == 'STUDENT'}" th:text="${u.schoolClass != null ? u.schoolClass.name : 'Unassigned'}"></span>
                        <span th:unless="${u.role.name() == 'STUDENT'}">—</span>
                    </td>
                    <td data-label="" class="action-group">
                        <form th:if="${!u.approved}" th:action="@{/admin/users/{id}/approve(id=${u.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="approve-btn">Approve</button>
                        </form>
                        <form th:if="${u.role.name() == 'STUDENT'}" th:action="@{/admin/users/{id}/assign-class(id=${u.id})}" method="post" class="action-group">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select name="classId" required>
                                <option value="">Assign class</option>
                                <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.name}"
                                        th:selected="${u.schoolClass != null and u.schoolClass.id == c.id}"></option>
                            </select>
                            <button type="submit" class="admin-nav-link">Set</button>
                        </form>
                        <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
